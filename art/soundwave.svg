<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200">
  <defs>
    <!-- Dark background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Horizontal spectrum gradient for the wave -->
    <linearGradient id="waveColor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#06b6d4"/>   <!-- cyan -->
      <stop offset="18%"  stop-color="#3b82f6"/>   <!-- blue -->
      <stop offset="36%"  stop-color="#8b5cf6"/>   <!-- violet -->
      <stop offset="54%"  stop-color="#d946ef"/>   <!-- fuchsia -->
      <stop offset="72%"  stop-color="#ec4899"/>   <!-- pink -->
      <stop offset="88%"  stop-color="#f59e0b"/>   <!-- amber -->
      <stop offset="100%" stop-color="#84cc16"/>   <!-- lime -->
    </linearGradient>

    <!-- Same gradient, slightly brighter, for the stroke -->
    <linearGradient id="waveStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#67e8f9"/>
      <stop offset="18%"  stop-color="#93c5fd"/>
      <stop offset="36%"  stop-color="#c4b5fd"/>
      <stop offset="54%"  stop-color="#f0abfc"/>
      <stop offset="72%"  stop-color="#f9a8d4"/>
      <stop offset="88%"  stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#bef264"/>
    </linearGradient>

    <!-- Radial glow for center line -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter (wide bloom) -->
    <filter id="bloom" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle blur for the glow copy -->
    <filter id="softBloom" x="-5%" y="-60%" width="110%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <!-- Clip to canvas -->
    <clipPath id="canvas">
      <rect width="1000" height="200"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1000" height="200" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="50"  x2="1000" y2="50"/>
    <line x1="0" y1="100" x2="1000" y2="100"/>
    <line x1="0" y1="150" x2="1000" y2="150"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
    <line x1="900" y1="0" x2="900" y2="200"/>
  </g>

  <!-- Center baseline -->
  <line x1="0" y1="100" x2="1000" y2="100" stroke="#334155" stroke-width="1"/>

  <!--
    Waveform path — hand-crafted smooth waveform resembling
    a year of contribution data (quiet months, busy sprints, etc.)
    Upper and lower arms are symmetric about y=100.

    Strategy: cubic bezier segments, upper envelope from y=100
    up to varying heights. The closed shape goes:
      upper left → upper right → lower right (mirror) → lower left → close
  -->

