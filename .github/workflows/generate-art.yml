name: Generate GitHub Activity Art

on:
  schedule:
    - cron: '0 0 1 * *'   # 1st of every month at 00:00 UTC
  workflow_dispatch:       # manual trigger

permissions:
  issues: write   # 失败告警需要开 issue
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate art
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          cat << 'PYEOF' > generate.py
          import json
          import math
          import os
          import random
          import requests
          from datetime import datetime, timedelta

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = os.environ["REPO_OWNER"]

          # ── 1. Fetch contribution data via GraphQL ──────────────────────────
          QUERY = """
          query($username: String!) {
            user(login: $username) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                      color
                    }
                  }
                }
              }
            }
          }
          """

          resp = requests.post(
              "https://api.github.com/graphql",
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json",
              },
              json={"query": QUERY, "variables": {"username": USERNAME}},
              timeout=30,
          )
          resp.raise_for_status()
          data = resp.json()
          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          total = calendar["totalContributions"]
          weeks = calendar["weeks"]

          # ── 2. Parse the 53×7 grid ─────────────────────────────────────────
          all_days = []
          for week in weeks:
              for day in week["contributionDays"]:
                  all_days.append({
                      "date": day["date"],
                      "count": day["contributionCount"],
                      "color": day["color"],
                  })

          # Week column sums (for skyline heights)
          week_totals = [
              sum(d["contributionCount"] for d in week["contributionDays"])
              for week in weeks
          ]

          # Stats
          max_count = max(d["count"] for d in all_days) if all_days else 1

          # Longest streak
          streak = cur = 0
          for d in all_days:
              if d["count"] > 0:
                  cur += 1
                  streak = max(streak, cur)
              else:
                  cur = 0

          busiest = max(all_days, key=lambda d: d["count"])
          busiest_week_idx = max(range(len(week_totals)), key=lambda i: week_totals[i])
          year = datetime.now().year

          stats = {
              "year": year,
              "total_contributions": total,
              "longest_streak": streak,
              "busiest_day": busiest["date"],
              "busiest_week": busiest_week_idx,
              "last_generated": datetime.utcnow().strftime("%Y-%m-%d"),
          }

          # ── 3. Artwork 1 — Skyline ─────────────────────────────────────────
          W, H = 1000, 300
          GROUND = 220
          max_week = max(week_totals) if week_totals else 1

          rng = random.Random(42)

          def skyline_svg(weeks_data, week_totals, rng):
              n = len(week_totals)
              col_w = W / max(n, 1)
              lines = []
              lines.append(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" width="{W}" height="{H}">')
              lines.append('<defs>')
              lines.append('<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">')
              lines.append('  <stop offset="0%" stop-color="#0a0a2e"/>')
              lines.append('  <stop offset="60%" stop-color="#1a1a4e"/>')
              lines.append('  <stop offset="100%" stop-color="#2d1b69"/>')
              lines.append('</linearGradient>')
              lines.append('<linearGradient id="building" x1="0" y1="0" x2="0" y2="1">')
              lines.append('  <stop offset="0%" stop-color="#4f6ef7"/>')
              lines.append('  <stop offset="100%" stop-color="#7c3aed"/>')
              lines.append('</linearGradient>')
              lines.append('<linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">')
              lines.append('  <stop offset="0%" stop-color="#4f6ef7" stop-opacity="0.5"/>')
              lines.append('  <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>')
              lines.append('</linearGradient>')
              lines.append('<filter id="glow">')
              lines.append('  <feGaussianBlur stdDeviation="3" result="blur"/>')
              lines.append('  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>')
              lines.append('</filter>')
              lines.append('</defs>')

              # Sky background
              lines.append(f'<rect width="{W}" height="{H}" fill="url(#sky)"/>')

              # Moon
              lines.append('<circle cx="880" cy="45" r="28" fill="#fffde7" filter="url(#glow)" opacity="0.9"/>')
              lines.append('<circle cx="892" cy="38" r="22" fill="#1a1a4e"/>')  # crescent cutout

              # Stars
              for _ in range(80):
                  sx = rng.randint(0, W)
                  sy = rng.randint(0, GROUND - 30)
                  sr = rng.uniform(0.5, 2.0)
                  so = rng.uniform(0.4, 1.0)
                  lines.append(f'<circle cx="{sx}" cy="{sy}" r="{sr:.1f}" fill="white" opacity="{so:.2f}"/>')

              # Ground line
              lines.append(f'<rect x="0" y="{GROUND}" width="{W}" height="{H - GROUND}" fill="#0d0d1f"/>')

              # Water reflection shimmer
              lines.append(f'<rect x="0" y="{GROUND}" width="{W}" height="{H - GROUND}" fill="url(#reflection)" opacity="0.4"/>')

              # Buildings (bars) and their reflections
              for i, wt in enumerate(week_totals):
                  bar_h = int((wt / max(max_week, 1)) * (GROUND - 60)) + 4
                  x = int(i * col_w) + 1
                  bw = max(int(col_w) - 2, 2)
                  y_top = GROUND - bar_h

                  # Building body
                  lines.append(f'<rect x="{x}" y="{y_top}" width="{bw}" height="{bar_h}" fill="url(#building)" rx="1"/>')

                  # Windows (tiny bright dots)
                  if bar_h > 12:
                      for wy in range(y_top + 4, GROUND - 4, 7):
                          for wx in range(x + 2, x + bw - 2, 5):
                              if rng.random() > 0.45:
                                  lines.append(f'<rect x="{wx}" y="{wy}" width="2" height="3" fill="#ffd700" opacity="{rng.uniform(0.5,1.0):.2f}"/>')

                  # Reflection
                  ref_y = GROUND
                  lines.append(f'<rect x="{x}" y="{ref_y}" width="{bw}" height="{int(bar_h * 0.6)}" fill="url(#reflection)" rx="1" opacity="0.35"/>')

              lines.append('</svg>')
              return '\n'.join(lines)

          # ── 4. Artwork 2 — Soundwave ───────────────────────────────────────
          def soundwave_svg(all_days):
              SW, SH = 1000, 200
              MID = SH // 2
              counts = [d["count"] for d in all_days] or [0]
              max_c = max(counts) if max(counts) else 1

              # Smooth the data via simple moving average
              def smooth(data, w=5):
                  out = []
                  for i in range(len(data)):
                      sl = data[max(0, i - w): i + w + 1]
                      out.append(sum(sl) / len(sl))
                  return out

              smoothed = smooth(counts, 6)
              n = len(smoothed)

              # Build upper and lower wave paths
              def make_path(values, flip=False):
                  pts = []
                  for i, v in enumerate(values):
                      x = i / max(n - 1, 1) * SW
                      amp = (v / max_c) * (MID - 10)
                      y = MID - amp if not flip else MID + amp
                      pts.append((x, y))
                  # Smooth with cubic bezier approximation
                  if not pts:
                      return ""
                  d = f"M {pts[0][0]:.1f},{pts[0][1]:.1f}"
                  for i in range(1, len(pts)):
                      cx = (pts[i - 1][0] + pts[i][0]) / 2
                      d += f" Q {cx:.1f},{pts[i-1][1]:.1f} {pts[i][0]:.1f},{pts[i][1]:.1f}"
                  return d

              upper = make_path(smoothed, False)
              lower = make_path(smoothed, True)

              # Closed fill path: upper wave → right → lower wave reversed → left
              upper_pts = []
              lower_pts = []
              for i, v in enumerate(smoothed):
                  x = i / max(n - 1, 1) * SW
                  amp = (v / max_c) * (MID - 10)
                  upper_pts.append((x, MID - amp))
                  lower_pts.append((x, MID + amp))

              def pts_to_smooth(pts):
                  d = f"M {pts[0][0]:.1f},{pts[0][1]:.1f}"
                  for i in range(1, len(pts)):
                      cx = (pts[i-1][0] + pts[i][0]) / 2
                      d += f" Q {cx:.1f},{pts[i-1][1]:.1f} {pts[i][0]:.1f},{pts[i][1]:.1f}"
                  return d

              fill_d = pts_to_smooth(upper_pts)
              # reverse lower to close
              fill_d += f" L {lower_pts[-1][0]:.1f},{lower_pts[-1][1]:.1f}"
              for i in range(len(lower_pts) - 2, -1, -1):
                  cx = (lower_pts[i+1][0] + lower_pts[i][0]) / 2
                  fill_d += f" Q {cx:.1f},{lower_pts[i+1][1]:.1f} {lower_pts[i][0]:.1f},{lower_pts[i][1]:.1f}"
              fill_d += " Z"

              lines = []
              lines.append(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {SW} {SH}" width="{SW}" height="{SH}">')
              lines.append('<defs>')
              lines.append('<linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">')
              lines.append('  <stop offset="0%" stop-color="#06b6d4"/>')
              lines.append('  <stop offset="35%" stop-color="#8b5cf6"/>')
              lines.append('  <stop offset="70%" stop-color="#ec4899"/>')
              lines.append('  <stop offset="100%" stop-color="#f59e0b"/>')
              lines.append('</linearGradient>')
              lines.append('<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">')
              lines.append('  <stop offset="0%" stop-color="#020617"/>')
              lines.append('  <stop offset="100%" stop-color="#0f172a"/>')
              lines.append('</linearGradient>')
              lines.append('<filter id="wglow">')
              lines.append('  <feGaussianBlur stdDeviation="4" result="blur"/>')
              lines.append('  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>')
              lines.append('</filter>')
              lines.append('</defs>')
              lines.append(f'<rect width="{SW}" height="{SH}" fill="url(#bgGrad)"/>')

              # Glow fill (blurred, wider)
              lines.append(f'<path d="{fill_d}" fill="url(#waveGrad)" opacity="0.25" filter="url(#wglow)"/>')
              # Main fill
              lines.append(f'<path d="{fill_d}" fill="url(#waveGrad)" opacity="0.55"/>')
              # Upper stroke
              lines.append(f'<path d="{pts_to_smooth(upper_pts)}" fill="none" stroke="url(#waveGrad)" stroke-width="2" opacity="0.9"/>')
              # Lower stroke
              lines.append(f'<path d="{pts_to_smooth(lower_pts)}" fill="none" stroke="url(#waveGrad)" stroke-width="2" opacity="0.9"/>')
              # Center line
              lines.append(f'<line x1="0" y1="{MID}" x2="{SW}" y2="{MID}" stroke="white" stroke-width="0.5" opacity="0.15"/>')

              lines.append('</svg>')
              return '\n'.join(lines)

          # ── 5. Artwork 3 — Constellation ──────────────────────────────────
          def constellation_svg(all_days, rng):
              CW, CH = 1000, 300
              THRESHOLD = 2  # minimum count to draw connecting lines

              # Map days to star positions
              n = len(all_days)
              stars = []
              for i, d in enumerate(all_days):
                  # Spread across canvas with some jitter
                  row = i % 7
                  col = i // 7
                  cols = n // 7 + 1
                  x = (col / max(cols - 1, 1)) * (CW - 60) + 30 + rng.uniform(-4, 4)
                  y = (row / 6) * (CH - 60) + 30 + rng.uniform(-3, 3)
                  size = max(1.0, (d["count"] / max(max_count, 1)) * 7)
                  stars.append({"x": x, "y": y, "size": size, "count": d["count"], "date": d["date"]})

              lines = []
              lines.append(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {CW} {CH}" width="{CW}" height="{CH}">')
              lines.append('<defs>')
              # Deep space background
              lines.append('<radialGradient id="spaceGrad" cx="50%" cy="50%" r="70%">')
              lines.append('  <stop offset="0%" stop-color="#0c1445"/>')
              lines.append('  <stop offset="100%" stop-color="#020209"/>')
              lines.append('</radialGradient>')
              # Nebula blobs
              lines.append('<radialGradient id="nebula1" cx="50%" cy="50%" r="50%">')
              lines.append('  <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>')
              lines.append('  <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>')
              lines.append('</radialGradient>')
              lines.append('<radialGradient id="nebula2" cx="50%" cy="50%" r="50%">')
              lines.append('  <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>')
              lines.append('  <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>')
              lines.append('</radialGradient>')
              lines.append('<radialGradient id="nebula3" cx="50%" cy="50%" r="50%">')
              lines.append('  <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15"/>')
              lines.append('  <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>')
              lines.append('</radialGradient>')
              lines.append('<filter id="starGlow">')
              lines.append('  <feGaussianBlur stdDeviation="2.5" result="blur"/>')
              lines.append('  <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>')
              lines.append('</filter>')
              lines.append('</defs>')

              # Background
              lines.append(f'<rect width="{CW}" height="{CH}" fill="url(#spaceGrad)"/>')

              # Nebula blobs
              lines.append(f'<ellipse cx="200" cy="120" rx="180" ry="100" fill="url(#nebula1)"/>')
              lines.append(f'<ellipse cx="700" cy="200" rx="220" ry="110" fill="url(#nebula2)"/>')
              lines.append(f'<ellipse cx="500" cy="80" rx="160" ry="80" fill="url(#nebula3)"/>')

              # Background micro stars
              for _ in range(120):
                  bx = rng.randint(0, CW)
                  by = rng.randint(0, CH)
                  br = rng.uniform(0.3, 1.0)
                  bo = rng.uniform(0.2, 0.6)
                  lines.append(f'<circle cx="{bx}" cy="{by}" r="{br:.1f}" fill="white" opacity="{bo:.2f}"/>')

              # Constellation lines between nearby bright stars
              bright = [s for s in stars if s["count"] >= THRESHOLD]
              for i, s1 in enumerate(bright):
                  for s2 in bright[i+1:]:
                      dist = math.hypot(s1["x"] - s2["x"], s1["y"] - s2["y"])
                      if dist < 45:
                          opacity = max(0.05, 0.4 - dist / 45 * 0.35)
                          lines.append(
                              f'<line x1="{s1["x"]:.1f}" y1="{s1["y"]:.1f}" '
                              f'x2="{s2["x"]:.1f}" y2="{s2["y"]:.1f}" '
                              f'stroke="#a5b4fc" stroke-width="0.7" opacity="{opacity:.2f}"/>'
                          )

              # Stars
              for s in stars:
                  if s["count"] == 0:
                      # Dim dot
                      lines.append(f'<circle cx="{s["x"]:.1f}" cy="{s["y"]:.1f}" r="0.8" fill="#334155" opacity="0.5"/>')
                  elif s["count"] < 3:
                      lines.append(f'<circle cx="{s["x"]:.1f}" cy="{s["y"]:.1f}" r="{s["size"]:.1f}" fill="#93c5fd" opacity="0.7"/>')
                  else:
                      # Bright star with glow
                      lines.append(
                          f'<circle cx="{s["x"]:.1f}" cy="{s["y"]:.1f}" r="{s["size"]:.1f}" '
                          f'fill="white" filter="url(#starGlow)" opacity="0.95"/>'
                      )
                      # Star spike cross
                      if s["size"] > 4:
                          sl = s["size"] * 2.5
                          lines.append(
                              f'<line x1="{s["x"]:.1f}" y1="{s["y"] - sl:.1f}" '
                              f'x2="{s["x"]:.1f}" y2="{s["y"] + sl:.1f}" '
                              f'stroke="white" stroke-width="0.5" opacity="0.5"/>'
                          )
                          lines.append(
                              f'<line x1="{s["x"] - sl:.1f}" y1="{s["y"]:.1f}" '
                              f'x2="{s["x"] + sl:.1f}" y2="{s["y"]:.1f}" '
                              f'stroke="white" stroke-width="0.5" opacity="0.5"/>'
                          )

              lines.append('</svg>')
              return '\n'.join(lines)

          # ── 6. Write files ─────────────────────────────────────────────────
          os.makedirs("art", exist_ok=True)

          with open("art/skyline.svg", "w") as f:
              f.write(skyline_svg(weeks, week_totals, rng))

          with open("art/soundwave.svg", "w") as f:
              f.write(soundwave_svg(all_days))

          with open("art/constellation.svg", "w") as f:
              f.write(constellation_svg(all_days, rng))

          with open("art/stats.json", "w") as f:
              json.dump(stats, f, indent=2)

          print(f"Done. Total: {total}, Streak: {streak}, Busiest: {busiest['date']}")
          PYEOF
          python generate.py

      - name: Commit and push generated art
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add art/
          git diff --cached --quiet || git commit -m "chore: regenerate activity art [$(date -u +%Y-%m-%d)]"
          # --- 改造：bot 不再直推 main，改为开 PR 并自动合并 ---
          git fetch origin main --depth=1 -q
          if [ -z "$(git log FETCH_HEAD..HEAD --oneline)" ]; then
            echo "No new commits; nothing to do."
            exit 0
          fi
          BRANCH="bot/$(date -u +%Y%m%d-%H%M%S)"
          git push -u origin "HEAD:$BRANCH"
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          gh pr create --base main --head "$BRANCH" \
            --title "$(git log -1 --pretty=%s)" \
            --body "Automated update by workflow: ${{ github.workflow }}"
          gh pr merge "$BRANCH" --squash --delete-branch


      - name: Notify on failure

        if: failure()

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          TITLE="⚠️ 工作流 ${{ github.workflow }} 运行失败"

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BODY="[${{ github.workflow }}]($RUN_URL) 于 $(date -u '+%Y-%m-%d %H:%M UTC') 失败（分支 ${{ github.ref_name }}，触发 ${{ github.event_name }}）。请查看日志。"

          EXISTING=$(gh issue list --state open --search "in:title $TITLE" --json number,title \

                     --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number")

          if [ -n "$EXISTING" ]; then

            gh issue comment "$EXISTING" --body "$BODY"

          else

            gh label create ci-failure --color d73a4a --description "自动化工作流失败告警" 2>/dev/null || true

            gh issue create --title "$TITLE" --body "$BODY" --label ci-failure 2>/dev/null \

              || gh issue create --title "$TITLE" --body "$BODY"

          fi

